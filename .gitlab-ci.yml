pages:
  stage: deploy
  script:
    - mkdir -p pages-dist/prototypes pages-dist/public/assets
    - cp -R prototypes/main-demo-v5 pages-dist/prototypes/main-demo-v5
    - cp -R public/assets/main-demo pages-dist/public/assets/main-demo
    - cp -R public/assets/main-demo-v4 pages-dist/public/assets/main-demo-v4
    - |
      cat > pages-dist/index.html <<'HTML'
      <!doctype html>
      <html lang="zh-CN">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <meta http-equiv="refresh" content="0; url=./prototypes/main-demo-v5/index.html" />
          <title>JourneyKit Demo</title>
        </head>
        <body>
          <a href="./prototypes/main-demo-v5/index.html">打开 JourneyKit main-demo-v5</a>
        </body>
      </html>
      HTML
    - rm -rf public
    - mv pages-dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
