<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bac1d8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>正向支付链路 · JourneyKit 香港线路 demo</title>
    <!--
      中转管家（trip-hkg-airport）五类能力由数据 + 视图模块渲染，非本页静态 HTML：
      1 登机牌状态识别 2 中转柜台导览 3 安检/登机口连续路径 4 登机倒计时与策略 5 异常提醒
      → src/data.js（transit 字段）、src/views/transit-helpers.js、transit-card.js、transit-assistant.js、styles/transit-*.css
    -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="legacy/hongkong_journey/prototypes/main-demo-v5/styles/tokens.css?v=v5-1" />
    <link rel="stylesheet" href="legacy/hongkong_journey/prototypes/main-demo-v5/styles/base.css?v=v5-1" />
    <link rel="stylesheet" href="legacy/hongkong_journey/prototypes/main-demo-v5/styles/personas.css?v=v5-1" />
    <!-- components.css 内部已 @import 了 personas.css / transit-card.css / transit-assistant.css，
         主 index 再 link 一次 personas.css 确保 :root fallback 生效（重复 @import 无副作用）。 -->
    <link rel="stylesheet" href="legacy/hongkong_journey/prototypes/main-demo-v5/styles/components.css?v=v5-3" />
    <style>
      /* 浅色 demo 舞台主题（参考 港航Qwen-对话流.html 的 --demo-bg） */
      :root {
        --demo-bg: #bac1d8;
      }

      body {
        background: var(--demo-bg);
      }

      .stage {
        background: transparent;
      }

      /* v5：dev-tabs 强制单行 + 横向滚动（窄视口不再换行）*/
      .dev-tabs {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 2px;
        padding: 5px 8px;
        max-width: 96vw;
        overflow-x: auto;
        scrollbar-width: none;
        background: rgba(20, 20, 24, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }
      .dev-tabs::-webkit-scrollbar { display: none; }
      .dev-tabs__group {
        display: flex;
        gap: 2px;
        padding: 0 2px;
        align-items: center;
        flex: 0 0 auto;
      }
      .dev-tabs__group + .dev-tabs__group {
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        margin-left: 2px;
        padding-left: 6px;
      }
      .dev-tabs button {
        flex: 0 0 auto;
        padding: 5px 9px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 11px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: background 120ms ease, transform 80ms ease;
      }
      .dev-tabs button:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .dev-tabs button:active {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(0.96);
      }
      .dev-tabs__label {
        color: rgba(255, 255, 255, 0.45);
        font-size: 10px;
        padding: 0 2px;
        letter-spacing: 0.04em;
        flex: 0 0 auto;
      }

      /* 手机框下方：人群切换（与 standalone/子效果_H5沉浸式.html 一致） */
      .persona-switcher {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px 8px;
        background: rgba(20, 20, 24, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
        z-index: 999;
        font-family: -apple-system, "PingFang SC", sans-serif;
      }
      .persona-switcher button {
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .persona-switcher button[aria-current="true"] {
        background: #fff;
        color: #0f131a;
      }

      /* 路径分隔箭头：在默认 16px 基础上等比缩小 2px */
      .route-arrow-ico {
        width: 14px;
        height: 14px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="device" role="presentation">
        <div class="app" id="app">
          <div class="notch" aria-hidden="true"></div>
          <div class="statusbar" aria-hidden="true">
            <span>9:41</span>
            <span class="right">5G · 100%</span>
          </div>
          <div class="app-frame" id="frame"></div>
          <div class="sheet-root" id="sheet-root" data-open="false">
            <div class="sheet-dim" data-action="close-sheet"></div>
            <div class="sheet" id="sheet"></div>
          </div>
          <div class="toast" id="toast" data-show="false"></div>
        </div>
      </div>
    </div>

    <div class="persona-switcher" id="personaSwitcher" role="group" aria-label="切换人群" hidden>
      <button type="button" data-persona="default">默认</button>
      <button type="button" data-persona="family" aria-current="true">亲子</button>
      <button type="button" data-persona="business">商旅</button>
    </div>

    <!-- portabled-demo-stage-dock begin -->
    <style id="demo-stage-dock-style">
      .demo-stage-dock-root { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); z-index: 100000; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
      .demo-stage-dock-fab { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #000; box-shadow: 0 6px 20px rgba(15, 19, 26, 0.35); transition: all 0.2s ease; }
      .demo-stage-dock-fab:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(15, 19, 26, 0.45); }
      .demo-stage-dock-fab:active { transform: scale(0.96); }
      .demo-stage-dock-fab svg { width: 24px; height: 24px; fill: #fff; }
      .demo-stage-dock-panel { display: none; position: absolute; right: 0; bottom: 60px; flex-direction: column; gap: 4px; min-width: 220px; max-height: 70vh; overflow-y: auto; padding: 12px; background: rgba(15, 19, 26, 0.96); border-radius: 20px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.32); backdrop-filter: blur(12px); }
      .demo-stage-dock-root.open .demo-stage-dock-panel { display: flex; }
      .demo-stage-dock-group-label { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; }
      .demo-stage-dock-group-label:not(:first-child) { margin-top: 4px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 10px; }
      .demo-stage-dock-item { display: flex; align-items: center; gap: 0; width: 100%; margin: 0; padding: 10px 12px; border: 0; border-radius: 10px; text-align: left; font-size: 13px; line-height: 1.4; color: #e8eaf0; background: rgba(255, 255, 255, 0.04); cursor: pointer; transition: all 0.15s ease; }
      .demo-stage-dock-item:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(-2px); }
      .demo-stage-dock-panel::-webkit-scrollbar { width: 4px; }
      .demo-stage-dock-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
      @media (prefers-reduced-motion: reduce) {
        .demo-stage-dock-fab, .demo-stage-dock-item { transition: none; }
      }
    </style>
    <div id="demoStageDockRoot" class="demo-stage-dock-root">
      <button type="button" class="demo-stage-dock-fab" id="demoStageDockFab" aria-haspopup="true" aria-expanded="false" aria-controls="demoStageDockPanel" title="演示阶段定位" aria-label="演示阶段定位">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="#ffffff" d="M12 14.5a2.5 2.5 0 1 1 2.5-2.5a2.5 2.5 0 0 1-2.5 2.5m0-4a1.5 1.5 0 1 0 1.5 1.5a1.5 1.5 0 0 0-1.5-1.5"/><path fill="#ffffff" d="M21.435 11.505h-1.46a7.98 7.98 0 0 0-7.48-7.48v-1.46a.51.51 0 0 0-.5-.5a.515.515 0 0 0-.5.5v1.46a8 8 0 0 0-7.48 7.48h-1.45a.5.5 0 1 0 0 1h1.45a8.01 8.01 0 0 0 7.48 7.48v1.45a.51.51 0 0 0 .5.5a.5.5 0 0 0 .5-.5v-1.45a8 8 0 0 0 7.48-7.48h1.46a.5.5 0 0 0 0-1M12 19.005a7 7 0 1 1 7-7a7.02 7.02 0 0 1-7 7"/></svg>
      </button>
      <div class="demo-stage-dock-panel" id="demoStageDockPanel" role="menu" aria-label="快速滚动">
        <div class="demo-stage-dock-group-label">首页</div>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=home" target="_top" style="text-decoration:none;">
          <span>首页</span>
        </a>

        <div class="demo-stage-dock-group-label">方案</div>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=plans" target="_top" style="text-decoration:none;">
          <span>方案列表</span>
        </a>

        <div class="demo-stage-dock-group-label">行程</div>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=itin-map" target="_top" style="text-decoration:none;">
          <span>行程·地图</span>
        </a>

        <div class="demo-stage-dock-group-label">下单</div>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=passengers" target="_top" style="text-decoration:none;">
          <span>出行人</span>
        </a>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=order" target="_top" style="text-decoration:none;">
          <span>订单确认</span>
        </a>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=pay" target="_top" style="text-decoration:none;">
          <span>支付</span>
        </a>

        <div class="demo-stage-dock-group-label">行中</div>
        <a class="demo-stage-dock-item" role="menuitem" href="payment.html?stage=prep" target="_top" style="text-decoration:none;">
          <span>出行管家</span>
        </a>
        <a class="demo-stage-dock-item" role="menuitem" href="flipbook.html" target="_top" style="text-decoration:none;">
          <span>Flipbook</span>
        </a>

        <div class="demo-stage-dock-group-label">打包退票</div>
        <a class="demo-stage-dock-item" role="menuitem" href="refund.html?refund=disruption" target="_top" style="text-decoration:none;">
          <span>航变退票</span>
        </a>

      </div>
    </div>
    <script id="demo-stage-dock-script">
      (function () {
        var root = document.getElementById("demoStageDockRoot");
        var fab = document.getElementById("demoStageDockFab");
        var panel = document.getElementById("demoStageDockPanel");
        if (!root || !fab || !panel) return;

        function setOpen(open) {
          root.classList.toggle("open", open);
          fab.setAttribute("aria-expanded", open ? "true" : "false");
        }

        fab.addEventListener("click", function (e) {
          e.stopPropagation();
          setOpen(!root.classList.contains("open"));
        });

        document.addEventListener("click", function () {
          setOpen(false);
        });
        root.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        // 直接为每个导航项绑定点击事件
        var items = panel.querySelectorAll(".demo-stage-dock-item");
        items.forEach(function(item) {
          item.addEventListener("click", function(e) {
            e.stopPropagation();
            var key = this.getAttribute("data-demo-stage");
            
            // 触发原有的 handlers
            var fn = window._demoHandlers && window._demoHandlers[key];
            if (fn) fn();
            
            setOpen(false);
          });
        });
      })();
    </script>
    <!-- portabled-demo-stage-dock end -->

    <script type="module" src="legacy/hongkong_journey/prototypes/main-demo-v5/src/main.js?v=v5-3"></script>
    <script type="module">
      // dev-tabs：手机框外的跳转 tab，方便演示直达。
      import { setState, subscribe, getState } from "./legacy/hongkong_journey/prototypes/main-demo-v5/src/state.js";
      import { bootChat, viewItinerary, setItineraryMode, startRefundFlow, confirmReplan, chooseFullRefund } from "./legacy/hongkong_journey/prototypes/main-demo-v5/src/actions.js";

      function readPersonaFromHash() {
        const m = (location.hash || "").match(/persona=([a-z]+)/i);
        return m ? m[1] : null;
      }

      const personaSwitcher = document.getElementById("personaSwitcher");
      const hashPersona = readPersonaFromHash();
      if (hashPersona) setState({ persona: hashPersona });

      /** 与侧栏「中转提示 (HKG)」「沉浸式 H5」一致：仅这两路需切人群 */
      function shouldShowPersonaSwitcher(s) {
        const hkg = s.selectedTripCardId === "trip-hkg-airport";
        return hkg && (s.screen === "trip" || s.screen === "trip-expanded");
      }

      function updatePersonaSwitcherVisibility() {
        if (!personaSwitcher) return;
        personaSwitcher.hidden = !shouldShowPersonaSwitcher(getState());
      }

      function syncPersonaSwitcher() {
        if (!personaSwitcher) return;
        const p = getState().persona || "family";
        personaSwitcher.querySelectorAll("button[data-persona]").forEach((b) => {
          b.setAttribute("aria-current", b.dataset.persona === p ? "true" : "false");
        });
      }

      personaSwitcher?.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-persona]");
        if (!btn) return;
        setState({ persona: btn.dataset.persona });
        history.replaceState(null, "", `#persona=${btn.dataset.persona}`);
      });

      function onPersonaSwitcherState() {
        syncPersonaSwitcher();
        updatePersonaSwitcherVisibility();
      }

      subscribe(onPersonaSwitcherState);
      onPersonaSwitcherState();

      const PLAN = "balanced";
      const PAX = [
        { id: "p1", name: "李雷", self: true, idNo: "310107 19990909 9999", selected: true },
      ];

      const handlers = {
        home: () => bootChat(),
        qa: () => {
          setState({
            screen: "chat",
            sheet: null,
            conversation: [
              { type: "greeting" },
              { type: "user", text: "6月1号从东莞去吉隆坡，怎么走最划算？", tone: "solid" },
              { type: "assistant", text: "为了更好的给你推荐行程方案，还需要回答几个问题，告诉我你的诉求：" },
              { type: "qa", qid: "q1" },
            ],
            intakeAnswers: {},
          });
        },
        plans: () => {
          setState({
            screen: "chat",
            sheet: null,
            conversation: [
              { type: "user", text: "6月1号从东莞去吉隆坡", tone: "solid" },
              { type: "plans-intro", text: "为你找到以下 3 种方案，供你选择" },
              { type: "plans" },
            ],
          });
        },
        "itin-half": () => { viewItinerary(PLAN); setItineraryMode("half"); },
        "itin-list": () => { viewItinerary(PLAN); setItineraryMode("list"); },
        "itin-map":  () => { viewItinerary(PLAN); setItineraryMode("map"); },
        passengers: () => {
          setState({
            screen: "chat",
            selectedPlanId: PLAN,
            sheet: "passenger-pick",
            passengers: PAX,
          });
        },
        order: () => {
          setState({
            screen: "chat",
            selectedPlanId: PLAN,
            sheet: "order-confirm",
            orderProgress: 100,
            passengers: PAX,
          });
        },
        pay: () => {
          setState({
            screen: "chat",
            selectedPlanId: PLAN,
            sheet: "pay-pad",
            payPadFilled: 3,
            paymentStatus: "pending",
          });
        },
        "refund-disruption": () => startRefundFlow("disruption"),
        "refund-replan-confirm": () => startRefundFlow("replan-confirm"),
        "refund-replan-processing": () => confirmReplan(),
        "refund-replan-success": () => startRefundFlow("replan-success"),
        "refund-all-processing": () => chooseFullRefund(),
        "refund-all-success": () => startRefundFlow("refund-all-success"),
        "refund-free": () => startRefundFlow("free"),
        "refund-fee": () => startRefundFlow("fee"),
        "refund-status": () => startRefundFlow("status"),
        "refund-blocked": () => startRefundFlow("blocked"),
        prep: () => {
          setState({
            screen: "prep",
            sheet: null,
            selectedPlanId: PLAN,
            paymentStatus: "paid",
          });
        },
        hkg: () => {
          setState({
            screen: "trip",
            sheet: null,
            selectedTripCardId: "trip-hkg-airport",
            selectedPlanId: PLAN,
            paymentStatus: "paid",
          });
        },
        // 沉浸式 H5：直接进入 trip-expanded（地图最大化 + 底部 peek sheet）
        h5: () => {
          setState({
            screen: "trip-expanded",
            sheet: null,
            selectedTripCardId: "trip-hkg-airport",
            selectedPlanId: PLAN,
            paymentStatus: "paid",
            transitSheetMode: "map",
          });
        },
      };

      // 暴露 handlers 给 Demo Stage Dock 使用（保留全部多阶段节点）
      window._demoHandlers = {
        home: handlers.home,
        qa: handlers.qa,
        plans: handlers.plans,
        "itin-half": handlers["itin-half"],
        "itin-list": handlers["itin-list"],
        "itin-map": handlers["itin-map"],
        passengers: handlers.passengers,
        order: handlers.order,
        pay: handlers.pay,
        "refund-disruption": handlers["refund-disruption"],
        "refund-replan-confirm": handlers["refund-replan-confirm"],
        "refund-replan-processing": handlers["refund-replan-processing"],
        "refund-replan-success": handlers["refund-replan-success"],
        "refund-all-processing": handlers["refund-all-processing"],
        "refund-all-success": handlers["refund-all-success"],
        "refund-free": handlers["refund-free"],
        "refund-fee": handlers["refund-fee"],
        "refund-status": handlers["refund-status"],
        "refund-blocked": handlers["refund-blocked"],
        prep: handlers.prep,
        hkg: handlers.hkg,
        h5: handlers.h5,
      };

      document.querySelectorAll(".dev-tabs button[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const fn = handlers[btn.dataset.jump];
          if (fn) fn();
        });
      });

      // 支持通过 ?stage=xxx 直达某个 demo 阶段（用于跨页 dock 跳转：
      // 如 refund.html 的"出行助手（行前页）"链接 → /payment.html?stage=prep）
      (function () {
        const stage = new URL(window.location.href).searchParams.get("stage");
        if (stage && handlers[stage]) handlers[stage]();
      })();
    </script>
  </body>
</html>
