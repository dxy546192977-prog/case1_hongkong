<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bac1d8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>退改链路 · AirouteDemo 香港线路 demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./legacy/hongkong_journey/prototypes/main-demo-v5/styles/tokens.css?v=v5-refund-1" />
    <link rel="stylesheet" href="./legacy/hongkong_journey/prototypes/main-demo-v5/styles/base.css?v=v5-refund-1" />
    <link rel="stylesheet" href="./legacy/hongkong_journey/prototypes/main-demo-v5/styles/personas.css?v=v5-refund-1" />
    <link rel="stylesheet" href="./legacy/hongkong_journey/prototypes/main-demo-v5/styles/components.css?v=v5-refund-1" />
    <style>
      :root {
        --demo-bg: #bac1d8;
      }

      html,
      body {
        background: var(--demo-bg);
      }

      .stage {
        background: transparent;
      }

      /* portabled-demo-stage-dock：与 payment.html 保持视觉/结构一致 */
      .demo-stage-dock-root { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); z-index: 100000; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
      .demo-stage-dock-fab { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #000; box-shadow: 0 6px 20px rgba(15, 19, 26, 0.35); transition: all 0.2s ease; }
      .demo-stage-dock-fab:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(15, 19, 26, 0.45); }
      .demo-stage-dock-fab:active { transform: scale(0.96); }
      .demo-stage-dock-fab svg { width: 24px; height: 24px; fill: #fff; }
      .demo-stage-dock-panel { display: none; position: absolute; right: 0; bottom: 60px; flex-direction: column; gap: 4px; min-width: 220px; max-height: 70vh; overflow-y: auto; padding: 12px; background: rgba(15, 19, 26, 0.96); border-radius: 20px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.32); backdrop-filter: blur(12px); }
      .demo-stage-dock-root.open .demo-stage-dock-panel { display: flex; }
      .demo-stage-dock-group-label { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; }
      .demo-stage-dock-group-label:not(:first-child) { margin-top: 4px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 10px; }
      .demo-stage-dock-item { display: flex; align-items: center; gap: 0; width: 100%; margin: 0; padding: 10px 12px; border: 0; border-radius: 10px; text-align: left; font-size: 13px; line-height: 1.4; color: #e8eaf0; background: rgba(255, 255, 255, 0.04); cursor: pointer; transition: all 0.15s ease; text-decoration: none; }
      .demo-stage-dock-item:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(-2px); }
      .demo-stage-dock-panel::-webkit-scrollbar { width: 4px; }
      .demo-stage-dock-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
      /* 数据源（国内/国际）分段开关 —— 永远固定在 panel 最顶部 */
      .demo-stage-dock-region { display: flex; gap: 4px; padding: 4px; margin: 0 0 8px; background: rgba(255, 255, 255, 0.06); border-radius: 12px; }
      .demo-stage-dock-region button { flex: 1; appearance: none; border: 0; background: transparent; color: rgba(255, 255, 255, 0.65); font-size: 12px; font-weight: 600; line-height: 1; padding: 8px 10px; border-radius: 9px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
      .demo-stage-dock-region button[aria-pressed="true"] { background: #ffffff; color: #0f131a; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); }
      .demo-stage-dock-region button:not([aria-pressed="true"]):hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
      @media (prefers-reduced-motion: reduce) {
        .demo-stage-dock-fab, .demo-stage-dock-item, .demo-stage-dock-region button { transition: none; }
      }
    </style>
    <script>
      (function () {
        var url = new URL(window.location.href);
        if (!url.searchParams.has("refund")) {
          url.searchParams.set("refund", "disruption");
          window.history.replaceState(null, "", url.href);
        }
      })();
    </script>
    <!--
      refund.html 与 payment.html 的"出行助手（prep）"页共享同一份状态种子：
      - selectedPlanId / passengers / paymentStatus 与支付完成态一致
      - 这样 refund 视图里的 getOrderSummary 拿到的订单/航班/出发/出行人
        与上一页"出票后将短信通知你，航变保障已开启"卡片完全一致
      - paymentStatus="paid" 让 refund 顶部返回按钮指向 back-to-prep，
        点返回会自然回到那张"出行助手"页
      种子注入 main.js 之后立即触发，main.js 内会订阅 state 变更并 re-render。
    -->
  </head>
  <body>
    <div class="stage">
      <div class="device" role="presentation">
        <div class="app" id="app">
          <div class="notch" aria-hidden="true"></div>
          <div class="statusbar" aria-hidden="true">
            <span>9:41</span>
            <span class="right">5G · 100%</span>
          </div>
          <div class="app-frame" id="frame"></div>
          <div class="sheet-root" id="sheet-root" data-open="false">
            <div class="sheet-dim" data-action="close-sheet"></div>
            <div class="sheet" id="sheet"></div>
          </div>
          <div class="toast" id="toast" data-show="false"></div>
        </div>
      </div>
    </div>

    <div id="demoStageDockRoot" class="demo-stage-dock-root">
      <button type="button" class="demo-stage-dock-fab" id="demoStageDockFab" aria-haspopup="true" aria-expanded="false" aria-controls="demoStageDockPanel" title="演示阶段定位" aria-label="演示阶段定位">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="#ffffff" d="M12 14.5a2.5 2.5 0 1 1 2.5-2.5a2.5 2.5 0 0 1-2.5 2.5m0-4a1.5 1.5 0 1 0 1.5 1.5a1.5 1.5 0 0 0-1.5-1.5"/><path fill="#ffffff" d="M21.435 11.505h-1.46a7.98 7.98 0 0 0-7.48-7.48v-1.46a.51.51 0 0 0-.5-.5a.515.515 0 0 0-.5.5v1.46a8 8 0 0 0-7.48 7.48h-1.45a.5.5 0 1 0 0 1h1.45a8.01 8.01 0 0 0 7.48 7.48v1.45a.51.51 0 0 0 .5.5a.5.5 0 0 0 .5-.5v-1.45a8 8 0 0 0 7.48-7.48h1.46a.5.5 0 0 0 0-1M12 19.005a7 7 0 1 1 7-7a7.02 7.02 0 0 1-7 7"/></svg>
      </button>
      <div class="demo-stage-dock-panel" id="demoStageDockPanel" role="menu" aria-label="快速滚动">
        <div class="demo-stage-dock-region" role="group" aria-label="数据源">
          <button type="button" data-demo-region="international" aria-pressed="true">国际</button>
          <button type="button" data-demo-region="domestic" aria-pressed="false">国内</button>
        </div>
        <div class="demo-stage-dock-group-label">首页</div>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=home" target="_top">
          <span>首页</span>
        </a>

        <div class="demo-stage-dock-group-label">方案</div>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=plans" target="_top">
          <span>方案列表</span>
        </a>

        <div class="demo-stage-dock-group-label">行程</div>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=itin-map" target="_top">
          <span>行程·地图</span>
        </a>

        <div class="demo-stage-dock-group-label">下单</div>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=passengers" target="_top">
          <span>出行人</span>
        </a>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=order" target="_top">
          <span>订单确认</span>
        </a>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=pay" target="_top">
          <span>支付</span>
        </a>

        <div class="demo-stage-dock-group-label">行中</div>
        <a class="demo-stage-dock-item" role="menuitem" href="./payment.html?stage=prep" target="_top">
          <span>出行管家</span>
        </a>
        <a class="demo-stage-dock-item" role="menuitem" href="./flipbook.html" target="_top">
          <span>Flipbook</span>
        </a>

        <div class="demo-stage-dock-group-label">打包退票</div>
        <a class="demo-stage-dock-item" role="menuitem" href="refund.html?refund=disruption" target="_top">
          <span>航变退票</span>
        </a>
      </div>
    </div>

    <script>
      (function () {
        var root = document.getElementById("demoStageDockRoot");
        var fab = document.getElementById("demoStageDockFab");
        var panel = document.getElementById("demoStageDockPanel");
        if (!root || !fab) return;
        function setOpen(open) {
          root.classList.toggle("open", open);
          fab.setAttribute("aria-expanded", open ? "true" : "false");
        }
        fab.addEventListener("click", function (e) {
          e.stopPropagation();
          setOpen(!root.classList.contains("open"));
        });
        document.addEventListener("click", function () {
          setOpen(false);
        });
        root.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        // 数据源（国内/国际）分段开关：与 src/legacy/.../data-source.js 共用 localStorage key
        var REGION_KEY = "demo-region";
        var VALID = { international: 1, domestic: 1 };
        function readRegion() {
          try {
            var v = window.localStorage.getItem(REGION_KEY);
            return VALID[v] ? v : "international";
          } catch (e) { return "international"; }
        }
        var current = readRegion();
        var regionBtns = panel ? panel.querySelectorAll(".demo-stage-dock-region button[data-demo-region]") : [];
        regionBtns.forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-demo-region") === current ? "true" : "false");
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var next = this.getAttribute("data-demo-region");
            if (!VALID[next] || next === readRegion()) return;
            try { window.localStorage.setItem(REGION_KEY, next); } catch (err) {}
            window.location.reload();
          });
        });
      })();
    </script>
    <script type="module" src="./legacy/hongkong_journey/prototypes/main-demo-v5/src/main.js?v=v5-refund-1"></script>
    <script type="module">
      // 与 payment.html 共享同一份"已支付"上下文：
      // PLAN / PAX 必须与 payment.html 中保持一致，确保 prep 页（截图）→ refund 页
      // 的订单信息（订单标题、出发时间、航班号、出行人）从上到下顺下来。
      import { setState } from "./legacy/hongkong_journey/prototypes/main-demo-v5/src/state.js";

      const PLAN = "balanced";
      const PAX = [
        { id: "p1", name: "李雷", self: true, idNo: "310107 19990909 9999", selected: true },
      ];

      // 解析 ?refund=xxx，决定进入哪个退改子流程
      const ALLOWED_FLOWS = [
        "disruption",
        "replan-confirm",
        "replan-processing",
        "replan-success",
        "refund-all-processing",
        "refund-all-success",
        "free",
        "fee",
        "submitted",
        "status",
        "blocked",
        "failed",
      ];
      const url = new URL(window.location.href);
      const flowParam = url.searchParams.get("refund");
      const refundFlow = ALLOWED_FLOWS.includes(flowParam) ? flowParam : "disruption";

      // 一次性把状态种到"支付完成 + 进入退改"的复合态：
      // - paymentStatus="paid" → refund 视图返回按钮指向 back-to-prep，回到截图那张出行助手页
      // - selectedPlanId/passengers → getOrderSummary 直接命中和 prep 页一致的字段
      setState({
        screen: "refund",
        sheet: null,
        selectedPlanId: PLAN,
        passengers: PAX,
        paymentStatus: "paid",
        refundFlow,
      });
    </script>
  </body>
</html>
