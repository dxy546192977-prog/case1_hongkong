    <!--
      中转管家（trip-hkg-airport）五类能力由数据 + 视图模块渲染，非本页静态 HTML：
      1 登机牌状态识别 2 中转柜台导览 3 安检/登机口连续路径 4 登机倒计时与策略 5 异常提醒
      → src/data.js（transit 字段）、src/views/transit-helpers.js、transit-card.js、transit-assistant.js、styles/transit-*.css
    -->

    <link rel="stylesheet" href="./hongkong_journey/prototypes/main-demo-v5/styles/components.css?v=v5-3" />
    <style>
      /* 浅色 demo 舞台主题（参考 港航Qwen-对话流.html 的 --demo-bg） */
      :root {
        --demo-bg: #bac1d8;
      }

      body {
        background: var(--demo-bg);
      }

      .stage {
        background: transparent;
      }

      /* v5：dev-tabs 强制单行 + 横向滚动（窄视口不再换行）*/
      .dev-tabs {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 2px;
        padding: 5px 8px;
        max-width: 96vw;
        overflow-x: auto;
        scrollbar-width: none;
        background: rgba(20, 20, 24, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }
      .dev-tabs::-webkit-scrollbar { display: none; }
      .dev-tabs__group {
        display: flex;
        gap: 2px;
        padding: 0 2px;
        align-items: center;
        flex: 0 0 auto;
      }
      .dev-tabs__group + .dev-tabs__group {
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        margin-left: 2px;
        padding-left: 6px;
      }
      .dev-tabs button {
        flex: 0 0 auto;
        padding: 5px 9px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 11px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: background 120ms ease, transform 80ms ease;
      }
      .dev-tabs button:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .dev-tabs button:active {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(0.96);
      }
      .dev-tabs__label {
        color: rgba(255, 255, 255, 0.45);
        font-size: 10px;
        padding: 0 2px;
        letter-spacing: 0.04em;
        flex: 0 0 auto;
      }

      /* 手机框下方：人群切换（与 standalone/子效果_H5沉浸式.html 一致） */
      .persona-switcher {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px 8px;
        background: rgba(20, 20, 24, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
        z-index: 999;
        font-family: -apple-system, "PingFang SC", sans-serif;
      }
      .persona-switcher button {
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .persona-switcher button[aria-current="true"] {
        background: #fff;
        color: #0f131a;
      }

      /* 路径分隔箭头：在默认 16px 基础上等比缩小 2px */
      .route-arrow-ico {
        width: 14px;
        height: 14px;
        opacity: 0.5;
      }
    </style>

    <script id="demo-stage-dock-script">
      (function () {
        var root = document.getElementById("demoStageDockRoot");
        var fab = document.getElementById("demoStageDockFab");
        var panel = document.getElementById("demoStageDockPanel");
        if (!root || !fab || !panel) return;

        function setOpen(open) {
          root.classList.toggle("open", open);
          fab.setAttribute("aria-expanded", open ? "true" : "false");
        }

        fab.addEventListener("click", function (e) {
          e.stopPropagation();
          setOpen(!root.classList.contains("open"));
        });

        document.addEventListener("click", function () {
          setOpen(false);
        });
        root.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        // 直接为每个导航项绑定点击事件
        var items = panel.querySelectorAll(".demo-stage-dock-item");
        items.forEach(function(item) {
          item.addEventListener("click", function(e) {
            e.stopPropagation();
            var key = this.getAttribute("data-demo-stage");
            
            // 触发原有的 handlers
            var fn = window._demoHandlers && window._demoHandlers[key];
            if (fn) fn();
            
            setOpen(false);
          });
        });
      })();
    </script>

    <script type="module" src="./hongkong_journey/prototypes/main-demo-v5/src/main.js?v=v5-3"></script>
    <script type="module">
      // dev-tabs：手机框外的跳转 tab，方便演示直达。
      import { setState, subscribe, getState } from "./hongkong_journey/prototypes/main-demo-v5/src/state.js";
      import { bootChat, viewItinerary, setItineraryMode } from "./hongkong_journey/prototypes/main-demo-v5/src/actions.js";

      function readPersonaFromHash() {
        const m = (location.hash || "").match(/persona=([a-z]+)/i);
        return m ? m[1] : null;
      }

      const personaSwitcher = document.getElementById("personaSwitcher");
      const hashPersona = readPersonaFromHash();
      if (hashPersona) setState({ persona: hashPersona });

      /** 与侧栏「中转提示 (HKG)」「沉浸式 H5」一致：仅这两路需切人群 */
      function shouldShowPersonaSwitcher(s) {
        const hkg = s.selectedTripCardId === "trip-hkg-airport";
        return hkg && (s.screen === "trip" || s.screen === "trip-expanded");
      }

      function updatePersonaSwitcherVisibility() {
        if (!personaSwitcher) return;
        personaSwitcher.hidden = !shouldShowPersonaSwitcher(getState());
      }

      function syncPersonaSwitcher() {
        if (!personaSwitcher) return;
        const p = getState().persona || "family";
        personaSwitcher.querySelectorAll("button[data-persona]").forEach((b) => {
          b.setAttribute("aria-current", b.dataset.persona === p ? "true" : "false");
        });
      }

      personaSwitcher?.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-persona]");
        if (!btn) return;
        setState({ persona: btn.dataset.persona });
        history.replaceState(null, "", `#persona=${btn.dataset.persona}`);
      });

      function onPersonaSwitcherState() {
        syncPersonaSwitcher();
        updatePersonaSwitcherVisibility();
      }

      subscribe(onPersonaSwitcherState);
      onPersonaSwitcherState();

      const PLAN = "balanced";
      const PAX = [
        { id: "p1", name: "李雷", self: true, idNo: "310107 19990909 9999", selected: true },
      ];

      const handlers = {
        home: () => bootChat(),
        qa: () => {
          setState({
            screen: "chat",
            sheet: null,
            conversation: [
              { type: "greeting" },
              { type: "user", text: "6月1号从东莞去吉隆坡，怎么走最划算？", tone: "solid" },
              { type: "assistant", text: "为了更好的给你推荐行程方案，还需要回答几个问题，告诉我你的诉求：" },
              { type: "qa", qid: "q1" },
            ],
            intakeAnswers: {},
          });
        },
        plans: () => {
          setState({
            screen: "chat",
            sheet: null,
            conversation: [
              { type: "user", text: "6月1号从东莞去吉隆坡", tone: "solid" },
              { type: "plans-intro", text: "为你找到以下 3 种方案，供你选择" },
              { type: "plans" },
            ],
          });
        },
        "itin-half": () => { viewItinerary(PLAN); setItineraryMode("half"); },
        "itin-list": () => { viewItinerary(PLAN); setItineraryMode("list"); },
        "itin-map":  () => { viewItinerary(PLAN); setItineraryMode("map"); },
        passengers: () => {
          setState({
            screen: "chat",
            selectedPlanId: PLAN,
            sheet: "passenger-pick",
            passengers: PAX,
          });
        },
        order: () => {
          setState({
            screen: "chat",
            selectedPlanId: PLAN,
            sheet: "order-confirm",
            orderProgress: 100,
            passengers: PAX,
          });
        },
        pay: () => {
          setState({
            screen: "chat",
            selectedPlanId: PLAN,
            sheet: "pay-pad",
            payPadFilled: 3,
            paymentStatus: "pending",
          });
        },
        prep: () => {
          setState({
            screen: "prep",
            sheet: null,
            selectedPlanId: PLAN,
            paymentStatus: "paid",
          });
        },
        hkg: () => {
          setState({
            screen: "trip",
            sheet: null,
            selectedTripCardId: "trip-hkg-airport",
            selectedPlanId: PLAN,
            paymentStatus: "paid",
          });
        },
        // 沉浸式 H5：直接进入 trip-expanded（地图最大化 + 底部 peek sheet）
        h5: () => {
          setState({
            screen: "trip-expanded",
            sheet: null,
            selectedTripCardId: "trip-hkg-airport",
            selectedPlanId: PLAN,
            paymentStatus: "paid",
            transitSheetMode: "map",
          });
        },
      };

      // 暴露 handlers 给 Demo Stage Dock 使用（保留全部多阶段节点）
      window._demoHandlers = {
        home: handlers.home,
        qa: handlers.qa,
        plans: handlers.plans,
        "itin-half": handlers["itin-half"],
        "itin-list": handlers["itin-list"],
        "itin-map": handlers["itin-map"],
        passengers: handlers.passengers,
        order: handlers.order,
        pay: handlers.pay,
        prep: handlers.prep,
        hkg: handlers.hkg,
        h5: handlers.h5,
      };

      document.querySelectorAll(".dev-tabs button[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const fn = handlers[btn.dataset.jump];
          if (fn) fn();
        });
      });
    </script>
  </body>
</html>
